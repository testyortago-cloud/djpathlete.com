<h1>Left, right, and how the points add up</h1>
<p>Real app on the dev clone, a <code>/preview/rotational-performance-index</code> test run (nothing saved), and the quiz editor (edit typed, never saved). Funnel pages and admin have no dark mode.</p>
<figure><figcaption><b>1.</b> The first test. The side is in capitals at the top, the three things to check are a numbered list worth a point each, and every answer starts with its points.</figcaption><img src="01-left-side-and-the-three-points.png" alt=""></figure>
<figure><figcaption><b>2.</b> The same test, now the right side. A note says the left side was saved, the badge changes to an outline reading RIGHT SIDE, and the clip starts again from the beginning.</figcaption><img src="02-switch-to-the-right-side.png" alt=""></figure>
<figure><figcaption><b>3.</b> The same moment on a phone. The note and the side are the first things on screen.</figcaption><img src="03-phone-right-side.png" alt=""></figure>
<figure><figcaption><b>4.</b> The quiz editor, scrolled down to a question. The instructions under the question can now be edited. After any change, the top says “Unsaved changes” and stays in view.</figcaption><img src="04-editor-instructions-and-unsaved.png" alt=""></figure>
