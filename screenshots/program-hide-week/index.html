<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hide a week on a program</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:1100px;margin:32px auto;padding:0 16px;color:#223b44}
h1{color:#0E3F50}figure{margin:32px 0}img{width:100%;border:1px solid #ddd;border-radius:8px}figcaption{margin-top:8px}</style></head><body>
<h1>Hide a week on a program</h1>
<p>Real app, development clone, light mode only (neither the admin nor the client area has a dark mode).</p>
<figure><img src="01-hide-week-no-client.png" alt="Hide a week before any client is on the program"><figcaption><strong>01.</strong> Open a week and click Hide Week. It works before anyone is on the program, and stays hidden for every client you add.</figcaption></figure>
<figure><img src="02-client-hidden-week.png" alt="What the client sees in a hidden week"><figcaption><strong>02.</strong> The client can see that week 2 exists, but none of its workouts.</figcaption></figure>
<figure><img src="03-open-for-one-client.png" alt="Open a hidden week for one client only"><figcaption><strong>03.</strong> Once clients are on the program, you can still open a hidden week for one person.</figcaption></figure>
</body></html>
