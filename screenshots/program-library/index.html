<h1>Program library and weekly release</h1>
<p>Real app, development clone, light mode only (neither the admin nor the client area has a dark mode).</p>
<figure><img src="01-library-folders-and-programs.png" alt="The Library: folders on the left, programs in the folder on the right"><figcaption><strong>01.</strong> Folders hold your ready-made programs. Programs here are never shown to clients until you give one.</figcaption></figure>
<figure><img src="02-give-to-a-client.png" alt="Give a library program to one client as their own copy"><figcaption><strong>02.</strong> Pick a client, choose how many weeks they see first, and give the program. They get their own copy.</figcaption></figure>
<figure><img src="03-save-to-library.png" alt="Save a client's program into your library"><figcaption><strong>03.</strong> Save any client program as a ready-made copy in a folder. The original stays as it was.</figcaption></figure>
<figure><img src="04-week-panel.png" alt="Client week access: one week at a time, with weeks that are not out yet"><figcaption><strong>04.</strong> The coach sees every week for this client. Faded means not out yet. A crossed eye means hidden by you.</figcaption></figure>
<figure><img src="05-week-show-or-hide.png" alt="Open any week early, or hide it, for one client"><figcaption><strong>05.</strong> Open a week early with Show now, or keep it from the client with Hide.</figcaption></figure>
<figure><img src="06-client-week-1.png" alt="What the client sees: their first week, ready to train"><figcaption><strong>06.</strong> The client sees only the weeks you have opened. Week 1 is ready to train.</figcaption></figure>
<figure><img src="07-client-week-2-unlocks.png" alt="A week that is not out yet shows a date, not the workouts"><figcaption><strong>07.</strong> Week 2 is not out yet, so the client sees the date it opens instead of the workouts.</figcaption></figure>
<figure><img src="08-empty-library.png" alt="A new library starts empty, with one clear next step"><figcaption><strong>08.</strong> Before you make a folder, the Library tab is empty and tells you what to do first.</figcaption></figure>
<figure><img src="09-folder-delete-refused.png" alt="A folder that still holds programs cannot be deleted"><figcaption><strong>09.</strong> You cannot delete a folder that still has programs in it. The menu says what to do first.</figcaption></figure>
</body></html>
