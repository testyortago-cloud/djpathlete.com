name: Apply Supabase Migrations

# Applies any migration in supabase/migrations/ that production has not seen,
# whenever one lands on main. Unattended, by choice.
#
# READ scripts/migrations/apply.mjs AND scripts/migrations/baseline.sql BEFORE
# CHANGING THIS. The migrations directory and Supabase's own ledger cannot be
# reconciled (152 recorded rows against 209 files, versions like 20260812154832
# that no filename can produce, and two naming schemes side by side), so this
# keys on FILENAME via public.repo_migrations. That table was baselined on
# 2026-08-13 with the 208 filenames already applied; apply.mjs refuses to run if
# it is missing, because without it every migration looks unapplied and prod
# would be replayed from 00001.
#
# ORDERING CAVEAT, worth knowing and not fixed here: Vercel also builds on push
# to main, and nothing sequences the two. A push whose code reads a column its
# own migration adds can deploy before the column exists. Keep migrations
# additive and let code tolerate the old schema for one deploy.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/migrations/**"
      - ".github/workflows/apply-migrations.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List pending migrations without applying them"
        type: boolean
        default: false

# Never let two runs apply concurrently: they would both read the same pending
# list and race to insert the same ledger row. Queue instead of cancelling —
# cancelling mid-apply is exactly the case the in-transaction ledger protects
# against, and there is no reason to exercise it.
concurrency:
  group: apply-supabase-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 for a built-in fetch. No psql, no database password, no
      # PostgreSQL apt repo — the whole job is one script and one HTTPS call
      # per migration.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply pending migrations
        env:
          # A Personal Access Token from https://supabase.com/dashboard/account/tokens
          # NOT the database password, and NOT the service-role key.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The prod project ref, defaulted rather than required. It is not a
          # secret — it is already public in NEXT_PUBLIC_SUPABASE_URL — and
          # requiring it as a repo VARIABLE created a silent failure mode: put
          # in the Secrets tab by mistake, `vars.` resolves to empty and the job
          # dies complaining the ref is missing while the setting plainly exists.
          # Override with a repo variable to point this at a different project.
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'epzuvzkokzqtzomeyoha' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/migrations/apply.mjs
