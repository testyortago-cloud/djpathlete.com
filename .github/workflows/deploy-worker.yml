name: Deploy Render Worker (Cloud Run job)

# Rebuilds and redeploys the Captioned Cut render worker — the Cloud Run JOB
# "captioned-cut-render", built from render-worker/ via its Dockerfile — whenever
# worker code lands on main. Also runnable on demand from the Actions tab.
#
# `gcloud run jobs deploy --source` builds the image with Cloud Build and updates
# the job, blocking until it finishes — so this run's status reflects the real
# build + deploy (a 16Gi/4vCPU image with Chromium + Lexend Exa takes a while;
# hence the 30-minute timeout).
#
# Setup (one-time, no file edits needed):
#   • Secret  FIREBASE_SERVICE_ACCOUNT  → already set (reused from the app/functions
#     deploys). For THIS workflow the deploy SA must also have, in project
#     darrenjpaulcom:
#       - roles/run.developer             (create/update the Cloud Run job)
#       - roles/cloudbuild.builds.editor  (build the image — already granted)
#       - roles/artifactregistry.writer   (push the built image)
#       - roles/storage.admin OR object access on the Cloud Build source bucket
#                                         (gcloud uploads the source tarball there)
#       - roles/iam.serviceAccountUser on
#         captioned-cut-render@darrenjpaulcom.iam.gserviceaccount.com
#         (act-as, so the job keeps its runtime SA — the one with datastore.user
#         + bucket + secret access the worker needs)
#
# This workflow codifies the job's RESOURCE profile + runtime service account so a
# deploy is reproducible from the repo. It deliberately does NOT pass --set-secrets
# or --set-env-vars: the job's secret/env wiring was configured out-of-band and
# gcloud preserves any flags not supplied on an update. (The captionRender Firebase
# function still injects AI_JOB_ID / VIDEO_UPLOAD_ID per execution.)
on:
  push:
    branches: [main]
    paths:
      - "render-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

# Coalesce rapid worker pushes into one deploy, but never interrupt a build/deploy
# already in flight (a half-applied job revision is worse than a slightly stale one).
concurrency:
  group: deploy-render-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # credentials_json takes the SA key JSON directly; setup-gcloud then makes
      # gcloud pick it up. Same secret the app/functions deploys use.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Build render-worker/ (its Dockerfile) via Cloud Build and update the job.
      # Resource profile + runtime SA are reasserted; secrets/env are preserved.
      - name: Deploy Cloud Run job
        run: |
          gcloud run jobs deploy captioned-cut-render \
            --source render-worker \
            --project darrenjpaulcom \
            --region us-central1 \
            --memory 16Gi \
            --cpu 4 \
            --task-timeout 1800s \
            --max-retries 1 \
            --service-account captioned-cut-render@darrenjpaulcom.iam.gserviceaccount.com
